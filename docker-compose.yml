# Shared worker/API database and transport settings. API-only credentials are
# configured directly on platform-api below.
x-platform-environment: &platform-environment
  PLATFORM_DATABASE_DSN: postgresql://${PLATFORM_DB_USER:-marketgraph_platform}:${PLATFORM_DB_PASSWORD:-local-platform-change-me}@timescale:5432/marketgraph_platform
  PLATFORM_REDIS_URL: redis://redis:6379/0
  PLATFORM_DATA_SERVICE_URL: http://data-api:8001
  PLATFORM_GRAPH_SERVICE_URL: http://graph-api:8000
  PLATFORM_PROFESSIONAL_WEIGHT: ${PROFESSIONAL_EVIDENCE_WEIGHT:-1.5}

services:
  platform-db-init:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    command: ["python", "-m", "marketgraph_platform.bootstrap_database"]
    environment:
      PLATFORM_ADMIN_DSN: postgresql://${POSTGRES_USER:-stockgraph}:${POSTGRES_PASSWORD:-stockgraph}@timescale:5432/${POSTGRES_DB:-stockgraph}
      PLATFORM_DB_NAME: marketgraph_platform
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-marketgraph_platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-local-platform-change-me}
    depends_on:
      timescale: {condition: service_healthy}
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    ports: ["127.0.0.1:8002:8002"]
    environment:
      <<: *platform-environment
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Developer}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_BROKER_ENCRYPTION_KEY: ${PLATFORM_BROKER_ENCRYPTION_KEY:-}
      PLATFORM_AGENT_SERVICE_KEY: ${PLATFORM_AGENT_SERVICE_KEY:-}
      PLATFORM_AGENT_MODEL_ID: ${AGENTS_LLM_CHAT_MODEL:-${LLM_CHAT_MODEL:-gpt-4o-mini}}
      PLATFORM_AGENT_INPUT_USD_PER_MILLION: ${PLATFORM_AGENT_INPUT_USD_PER_MILLION:-}
      PLATFORM_AGENT_OUTPUT_USD_PER_MILLION: ${PLATFORM_AGENT_OUTPUT_USD_PER_MILLION:-}
      PLATFORM_AGENT_MONTHLY_USD_CAP: ${PLATFORM_AGENT_MONTHLY_USD_CAP:-10}
      PLATFORM_AGENT_JOB_USD_CAP: ${PLATFORM_AGENT_JOB_USD_CAP:-0.25}
      PLATFORM_AGENT_GRAPH_MIN_CONFIDENCE: ${ONTOLOGY_MIN_CONFIDENCE:-0.65}
      DOCUMENT_INTERNAL_API_KEY: ${DOCUMENT_INTERNAL_API_KEY:-}
      MARKETGRAPH_INTERNAL_SERVICE_KEY: ${MARKETGRAPH_INTERNAL_SERVICE_KEY:-}
      PLATFORM_SESSION_TTL_SECONDS: ${PLATFORM_SESSION_TTL_SECONDS:-43200}
    depends_on:
      platform-db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  platform-worker:
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    command: ["marketgraph-platform-worker"]
    environment: *platform-environment
    depends_on:
      platform-db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  data-api:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-api"]
    ports: ["8001:8001"]
    environment: &data-environment
      MARKETGRAPH_INTERNAL_SERVICE_KEY: ${MARKETGRAPH_INTERNAL_SERVICE_KEY:-}
      TIMESCALE_DSN: postgresql://${POSTGRES_USER:-stockgraph}:${POSTGRES_PASSWORD:-stockgraph}@timescale:5432/${POSTGRES_DB:-stockgraph}
      REDIS_URL: redis://redis:6379/0
      APP_TIMEZONE: Asia/Kolkata
      EVENT_STREAM: stockgraph:events:v1
      NEWS_ELIGIBILITY_URL: http://graph-api:8000/internal/v1/news/eligibility
      NEWS_ELIGIBILITY_TIMEOUT_SECONDS: ${NEWS_ELIGIBILITY_TIMEOUT_SECONDS:-8}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-${UPSTOX_AUTHTOKEN:-}}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
      CURRENT_NEWS_API_KEY: ${CURRENT_NEWS_API_KEY:-${CURRENTS_API_KEY:-}}
      FMP_API_KEY: ${FMP_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      NEWS_PROVIDERS_ENABLED: ${NEWS_PROVIDERS_ENABLED:-marketaux,currents,alphavantage,fmp}
      NEWS_REQUESTS_PER_RUN: ${NEWS_REQUESTS_PER_RUN:-2}
      NEWS_LOOKBACK_MINUTES: ${NEWS_LOOKBACK_MINUTES:-720}
      NEWS_MAX_ARTICLES_PER_RUN: ${NEWS_MAX_ARTICLES_PER_RUN:-60}
      DOCUMENT_STORAGE_ROOT: /app/documents
      DOCUMENT_INTERNAL_API_KEY: ${DOCUMENT_INTERNAL_API_KEY:-}
    volumes:
      - source-documents:/app/documents
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  data-worker:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-worker"]
    environment: *data-environment
    volumes:
      - source-documents:/app/documents
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  data-scheduler:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-scheduler"]
    environment: *data-environment
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  graph-api:
    build:
      context: .
      dockerfile: services/stockgraph/Dockerfile
    command: ["uvicorn", "stockgraph.runtime.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment: &graph-environment
      MARKETGRAPH_INTERNAL_SERVICE_KEY: ${MARKETGRAPH_INTERNAL_SERVICE_KEY:-}
      FALKOR_HOST: falkordb
      FALKOR_PORT: 6379
      FALKOR_GRAPH_NAME: ${FALKOR_GRAPH_NAME:-stock_graph}
      REDIS_URL: redis://redis:6379/0
      DATA_SERVICE_URL: http://data-api:8001
      DEVELOPER_GRAPH_MUTATIONS_ENABLED: ${DEVELOPER_GRAPH_MUTATIONS_ENABLED:-true}
      EVENT_STREAM: stockgraph:events:v1
      EVENT_CONSUMER_GROUP: graph-v1
      PLATFORM_STREAM_NAME: stockgraph:platform-events:v1
      PLATFORM_CONSUMER_GROUP: stockgraph-platform-v1
      PROFESSIONAL_EVIDENCE_WEIGHT: ${PROFESSIONAL_EVIDENCE_WEIGHT:-1.5}
      APP_TIMEZONE: Asia/Kolkata
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-legacy}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-auto}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_ONTOLOGY_MODEL: ${LLM_ONTOLOGY_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MAX_TOKENS_PER_CALL: ${LLM_MAX_TOKENS_PER_CALL:-4000}
      LLM_MONTHLY_USD_CAP: ${LLM_MONTHLY_USD_CAP:-50.0}
      BASETEN_API_BASE: ${BASETEN_API_BASE:-https://inference.baseten.co/v1}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      CHAT_PRICE_PER_1K: ${CHAT_PRICE_PER_1K:-0.00015}
      EMBEDDING_PRICE_PER_1K: ${EMBEDDING_PRICE_PER_1K:-0.00002}
      ONTOLOGY_MIN_CONFIDENCE: ${ONTOLOGY_MIN_CONFIDENCE:-0.65}
      DEDUP_COSINE_THRESHOLD: ${DEDUP_COSINE_THRESHOLD:-0.92}
      DEDUP_WINDOW_HOURS: ${DEDUP_WINDOW_HOURS:-48}
      CORRELATION_MIN_COSINE: ${CORRELATION_MIN_COSINE:-0.68}
      CORRELATION_WINDOW_DAYS: ${CORRELATION_WINDOW_DAYS:-14}
    depends_on:
      falkordb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  graph-worker:
    build:
      context: .
      dockerfile: services/stockgraph/Dockerfile
    command: ["stockgraph-worker"]
    environment: *graph-environment
    depends_on:
      falkordb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  agents-template:
    profiles: ["agents-template"]
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    ports: ["127.0.0.1:8005:8005"]
    environment:
      AGENTS_PLATFORM_URL: http://platform-api:8002
      AGENTS_PLATFORM_SERVICE_KEY: ${AGENTS_PLATFORM_SERVICE_KEY:-}
    restart: "no"

  agents-worker:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    command: ["stockgraph-agents-worker"]
    environment:
      AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
      AGENTS_PLATFORM_URL: http://platform-api:8002
      AGENTS_PLATFORM_SERVICE_KEY: ${PLATFORM_AGENT_SERVICE_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-legacy}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-auto}
      LLM_CHAT_MODEL: ${AGENTS_LLM_CHAT_MODEL:-${LLM_CHAT_MODEL:-gpt-4o-mini}}
      AGENTS_LLM_REASONING_EFFORT: ${AGENTS_LLM_REASONING_EFFORT:-low}
      AGENTS_MAX_OUTPUT_TOKENS: ${AGENTS_MAX_OUTPUT_TOKENS:-8192}
      AGENTS_USAGE_LOG_PATH: /app/logs/agents/agent-model-usage.jsonl
      BASETEN_API_BASE: ${BASETEN_API_BASE:-https://inference.baseten.co/v1}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
    volumes:
      - ./logs/agents:/app/logs/agents
    depends_on:
      platform-api: {condition: service_started}
    restart: "${AGENTS_RESTART_POLICY:-no}"

  falkordb:
    # Official image (server on 6379 + Browser UI on 3000). Pinned tag:
    # `latest` drifts across releases and can change vector/index syntax.
    image: falkordb/falkordb:v4.22.1
    container_name: stockgraph-falkordb
    ports:
      - "${FALKOR_PORT:-6379}:6379"
      - "${FALKOR_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkor-data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: stockgraph-timescale
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockgraph}
      POSTGRES_DB: ${POSTGRES_DB:-stockgraph}
    volumes:
      # Existing installations: follow docs/PHASE1_PLATFORM.md before recreating
      # a container whose old mount did not cover the image's actual PGDATA.
      - timescale-data:/home/postgres/pgdata/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockgraph} -d ${POSTGRES_DB:-stockgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockgraph-redis
    # XADD must be durable before its SQL outbox row is marked published.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkor-data:
  timescale-data:
  redis-data:
  source-documents:

networks:
  default:
    name: stockgraph-net

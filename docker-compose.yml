services:
  data-api:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-api"]
    ports: ["8001:8001"]
    environment: &data-environment
      TIMESCALE_DSN: postgresql://${POSTGRES_USER:-stockgraph}:${POSTGRES_PASSWORD:-stockgraph}@timescale:5432/${POSTGRES_DB:-stockgraph}
      REDIS_URL: redis://redis:6379/0
      APP_TIMEZONE: Asia/Kolkata
      EVENT_STREAM: stockgraph:events:v1
      NEWS_ELIGIBILITY_URL: http://graph-api:8000/internal/v1/news/eligibility
      NEWS_ELIGIBILITY_TIMEOUT_SECONDS: ${NEWS_ELIGIBILITY_TIMEOUT_SECONDS:-8}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
      CURRENT_NEWS_API_KEY: ${CURRENT_NEWS_API_KEY:-${CURRENTS_API_KEY:-}}
      FMP_API_KEY: ${FMP_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      NEWS_PROVIDERS_ENABLED: ${NEWS_PROVIDERS_ENABLED:-marketaux,currents,alphavantage,fmp}
      NEWS_REQUESTS_PER_RUN: ${NEWS_REQUESTS_PER_RUN:-2}
      NEWS_LOOKBACK_MINUTES: ${NEWS_LOOKBACK_MINUTES:-720}
      NEWS_MAX_ARTICLES_PER_RUN: ${NEWS_MAX_ARTICLES_PER_RUN:-60}
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  data-worker:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-worker"]
    environment: *data-environment
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  data-scheduler:
    build:
      context: .
      dockerfile: services/upstox/Dockerfile
    command: ["upstox-scheduler"]
    environment: *data-environment
    depends_on:
      timescale: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  graph-api:
    build:
      context: .
      dockerfile: services/stockgraph/Dockerfile
    command: ["uvicorn", "stockgraph.runtime.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment: &graph-environment
      FALKOR_HOST: falkordb
      FALKOR_PORT: 6379
      FALKOR_GRAPH_NAME: ${FALKOR_GRAPH_NAME:-stock_graph}
      REDIS_URL: redis://redis:6379/0
      DATA_SERVICE_URL: http://data-api:8001
      DEVELOPER_GRAPH_MUTATIONS_ENABLED: ${DEVELOPER_GRAPH_MUTATIONS_ENABLED:-false}
      EVENT_STREAM: stockgraph:events:v1
      EVENT_CONSUMER_GROUP: graph-v1
      APP_TIMEZONE: Asia/Kolkata
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_ONTOLOGY_MODEL: ${LLM_ONTOLOGY_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MONTHLY_USD_CAP: ${LLM_MONTHLY_USD_CAP:-50.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ONTOLOGY_MIN_CONFIDENCE: ${ONTOLOGY_MIN_CONFIDENCE:-0.65}
      DEDUP_COSINE_THRESHOLD: ${DEDUP_COSINE_THRESHOLD:-0.92}
      DEDUP_WINDOW_HOURS: ${DEDUP_WINDOW_HOURS:-48}
      CORRELATION_MIN_COSINE: ${CORRELATION_MIN_COSINE:-0.68}
      CORRELATION_WINDOW_DAYS: ${CORRELATION_WINDOW_DAYS:-14}
    depends_on:
      falkordb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  graph-worker:
    build:
      context: .
      dockerfile: services/stockgraph/Dockerfile
    command: ["stockgraph-worker"]
    environment: *graph-environment
    depends_on:
      falkordb: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  falkordb:
    # Official image (server on 6379 + Browser UI on 3000). Pinned tag:
    # `latest` drifts across releases and can change vector/index syntax.
    image: falkordb/falkordb:v4.22.1
    container_name: stockgraph-falkordb
    ports:
      - "${FALKOR_PORT:-6379}:6379"
      - "${FALKOR_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkor-data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: stockgraph-timescale
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockgraph}
      POSTGRES_DB: ${POSTGRES_DB:-stockgraph}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockgraph} -d ${POSTGRES_DB:-stockgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockgraph-redis
    # XADD must be durable before its SQL outbox row is marked published.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  falkor-data:
  timescale-data:
  redis-data:

networks:
  default:
    name: stockgraph-net

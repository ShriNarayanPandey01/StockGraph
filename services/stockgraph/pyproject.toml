[project]
name = "stockgraph-service"
version = "0.2.0"
description = "Graph-only stock intelligence, event processing and graph context API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "falkordb>=1.1.8",
  "pydantic>=2.7", "pydantic-settings>=2.3", "redis>=5.0", "httpx>=0.27",
  "litellm>=1.52", "tiktoken>=0.7", "tzdata>=2024.1", "mcp>=2.0,<3",
]

[project.scripts]
stockgraph-worker = "stockgraph.runtime.worker:main"
stockgraph-mcp = "stockgraph.adapters.api.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

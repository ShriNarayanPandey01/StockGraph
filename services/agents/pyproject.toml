[project]
name = "marketgraph-agents"
version = "0.1.0"
description = "Health-only scaffold for future MarketGraph agents"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.3"]

[project.scripts]
marketgraph-agents = "marketgraph_agents.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketgraph_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

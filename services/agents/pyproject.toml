[project]
name = "marketgraph-agents"
version = "0.1.0"
description = "StockGraph research, discovery and monitoring agents"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.3", "httpx>=0.27", "litellm>=1.52", "langgraph>=1.2,<2"]

[project.scripts]
marketgraph-agents = "marketgraph_agents.runtime:main"
stockgraph-agents-worker = "marketgraph_agents.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketgraph_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

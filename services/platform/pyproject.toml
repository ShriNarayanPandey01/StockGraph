[project]
name = "marketgraph-platform"
version = "0.1.0"
description = "Free MarketGraph application, publishing and external-agent backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "asyncpg>=0.29", "pydantic>=2.7", "pydantic-settings>=2.3", "httpx>=0.27", "redis>=5.0"]

[project.scripts]
marketgraph-platform = "marketgraph_platform.cli:main"
marketgraph-platform-worker = "marketgraph_platform.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketgraph_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "upstox-service"
version = "0.1.0"
description = "Provider ingestion and structured market-data service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "asyncpg>=0.29",
  "pydantic>=2.7", "pydantic-settings>=2.3", "redis>=5", "pyyaml>=6",
  "apscheduler>=3.10,<4", "sqlalchemy>=2", "tzdata>=2024.1",
  "pypdf>=5,<7",
]

[project.scripts]
upstox-api = "upstox_service.runtime.api:main"
upstox-worker = "upstox_service.runtime.worker:main"
upstox-scheduler = "upstox_service.runtime.scheduler:main"
upstox-bootstrap = "upstox_service.runtime.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upstox_service"]

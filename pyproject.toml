[project]
name = "stock-graphrag-engine"
version = "0.1.0"
description = "Temporal GraphRAG + Time-Series Stock Intelligence Platform for Indian Equities (Phase 1: ingestion + context service)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "StockGraph" }]
dependencies = [
    "asyncpg>=0.29",
    "falkordb>=1.1.8",
    "pydantic-settings>=2.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/upstox/tests", "services/stockgraph/tests", "services/platform/tests"]
pythonpath = [".", "services/upstox/src", "services/stockgraph/src", "services/platform/src"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.uv]
package = false

# The repository root is an operations/test workspace, not a deployable package.
# Production images install exactly one service.
[tool.uv.workspace]
members = ["services/upstox", "services/stockgraph", "services/platform"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]
